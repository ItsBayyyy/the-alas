<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Alas — prototipe 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050706; --ink:#e3d8bd; --ink-dim:#a0967e; --accent:#e0a63c; --danger:#b8352b;
  --panel:rgba(10,13,9,.74); --edge:rgba(227,216,189,.18);
  --sheet:#d4c6a4; --sheet-ink:#1d1a12; --sheet-dim:#5c5240; --scrim:rgba(6,8,5,.62);
  --type:"Special Elite","Courier New",Courier,monospace;
  --display:"Rubik Dirt","Impact","Arial Black",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sheet:#17190f;--sheet-ink:#e3d8bd;--sheet-dim:#a0967e;--scrim:rgba(0,0,0,.66);color-scheme:dark}
}
:root[data-theme="dark"]{--sheet:#17190f;--sheet-ink:#e3d8bd;--sheet-dim:#a0967e;--scrim:rgba(0,0,0,.66);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--type);overflow:hidden;-webkit-user-select:none;user-select:none}
#game{position:relative;width:100%;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
canvas.px{image-rendering:pixelated}
#grain{position:absolute;inset:-40%;pointer-events:none;opacity:.45;mix-blend-mode:overlay;animation:grain 1s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-2%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
#danger{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(140,18,8,.62) 100%)}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(227,216,189,.6);pointer-events:none}
#area{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);font-size:clamp(34px,4.5vw,64px);opacity:0;transition:opacity .9s;pointer-events:none;text-shadow:0 3px 14px #000}
@media (prefers-reduced-motion:reduce){#grain{animation:none}}
.hidden{display:none!important}
kbd{font-family:inherit;color:var(--ink);border:1px solid var(--edge);border-bottom-width:2px;padding:0 5px;border-radius:2px;font-size:.92em}

#hud{position:absolute;inset:0;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--edge);padding:10px 12px;clip-path:polygon(0 4px,7px 0,100% 3px,calc(100% - 2px) calc(100% - 5px),calc(100% - 9px) 100%,3px calc(100% - 2px))}
.lbl{font-size:12px;color:var(--ink-dim);letter-spacing:.04em}
#tl{position:absolute;left:20px;top:18px;width:270px}
#obj{list-style:none;margin:6px 0 0;padding:0;font-size:15px;line-height:1.6}
#obj li::before{content:"◇ ";color:var(--ink-dim)}
#obj li.carried{color:var(--accent)}
#obj li.carried::before{content:"◆ ";color:var(--accent)}
#obj li.done{color:var(--ink-dim);text-decoration:line-through}
#obj li.done::before{content:"✓ "}
#hints{margin-top:8px;font-size:13.5px;line-height:1.5}
#hints ul{list-style:none;margin:6px 0 0;padding:0}
#hints li{margin-bottom:7px}
#hints li b{font-weight:400;color:var(--accent)}
#hints li.got{opacity:.45;text-decoration:line-through}
#tc{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:min(460px,44vw);text-align:center}
#timer{font-family:var(--display);font-size:46px;line-height:1;text-shadow:0 2px 0 #000}
#timer.late{color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
#compass{position:relative;margin-top:10px;height:26px;border-bottom:1px solid var(--edge);background:linear-gradient(90deg,transparent,rgba(10,13,9,.55) 20%,rgba(10,13,9,.55) 80%,transparent)}
#compass::after{content:"";position:absolute;left:50%;bottom:-4px;width:1px;height:8px;background:var(--ink-dim)}
.cmk{position:absolute;bottom:4px;transform:translateX(-50%);font-size:13px;white-space:nowrap;display:none}
#keyhint{position:absolute;right:20px;top:18px;font-size:13px;color:var(--ink-dim);text-align:right;line-height:2}
#bl{position:absolute;left:20px;bottom:20px;width:320px}
.bar{display:flex;align-items:center;gap:10px}
.bar+.bar{margin-top:8px}
.bar .lbl{width:52px;font-size:13px}
.track{flex:1;height:11px;background:rgba(227,216,189,.08);border:1px solid var(--edge);overflow:hidden}
.fill{height:100%;width:0;background:var(--ink)}
#state{font-size:13px;color:var(--accent);margin-top:8px;min-height:1em}
#br{position:absolute;right:20px;bottom:20px;min-width:210px;text-align:right;font-size:14px;line-height:1.5}
#loadVal{font-family:var(--display);font-size:36px;line-height:1.05;color:var(--ink)}
#inv{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:6px;max-width:calc(100% - 640px);flex-wrap:wrap;justify-content:center}
.slot{min-width:96px;padding:6px 10px;background:var(--panel);border:1px solid var(--edge);font-size:13px;line-height:1.35}
.slot .n{color:var(--ink-dim);font-size:11.5px}
.slot.sel{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.slot.req .nm{color:var(--accent)}
.slot.empty{opacity:.6}
#prompt{position:absolute;left:50%;top:calc(50% + 40px);transform:translateX(-50%);font-size:17px;background:var(--panel);border:1px solid var(--edge);padding:7px 16px;max-width:70%;text-align:center;opacity:0;transition:opacity .15s}
#prompt.show{opacity:1}
#toast{position:absolute;left:50%;top:70%;transform:translate(-50%,-50%);width:70%;font-size:20px;text-align:center;opacity:0;transition:opacity .35s;text-shadow:0 2px 8px #000,0 0 2px #000}
#help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,90vw);display:none;font-size:14.5px}
#help.show{display:block}
.ctl{width:100%;border-collapse:collapse;margin-top:6px}
.ctl td{padding:4px 0;border-bottom:1px dashed rgba(128,118,96,.35);vertical-align:top}
.ctl td.k{text-align:right;white-space:nowrap;padding-left:16px}

#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--scrim);padding:24px;z-index:10;overflow:auto}
.sheet{background:var(--sheet);color:var(--sheet-ink);max-width:600px;width:100%;margin:auto;padding:32px 34px 28px;clip-path:polygon(0 6px,14px 0,60% 4px,100% 0,calc(100% - 4px) 55%,100% calc(100% - 8px),70% 100%,8px calc(100% - 3px),3px 60%)}
.sheet h1{font-family:var(--display);font-weight:400;font-size:68px;line-height:.95;margin:0 0 6px;text-align:center}
.sheet .tag{text-align:center;color:var(--sheet-dim);font-size:15px;margin-bottom:20px}
.sheet p{font-size:15px;line-height:1.65;margin:0 0 12px}
.sheet .warn{border:1px dashed var(--sheet-dim);padding:8px 10px;font-size:14px}
.sheet details{border-top:1px dashed var(--sheet-dim);padding-top:10px;margin-top:12px;font-size:14px}
.sheet summary{cursor:pointer;color:var(--sheet-ink);font-size:15px}
.sheet .ctl{font-size:13.5px;color:var(--sheet-ink)}
.sheet .stats{list-style:none;padding:10px 0 0;margin:4px 0 0;font-size:15px;line-height:1.8;border-top:1px dashed var(--sheet-dim)}
.row{display:grid;grid-template-columns:1fr 170px 52px;align-items:center;gap:12px;font-size:14px;margin:10px 0}
.row output{text-align:right;color:var(--sheet-dim)}
.row input[type=range]{width:100%;accent-color:var(--sheet-ink)}
.row input[type=checkbox]{justify-self:start;width:18px;height:18px;accent-color:var(--sheet-ink)}
.row select{font:inherit;font-size:14px;background:var(--sheet);color:var(--sheet-ink);border:1px solid var(--sheet-dim);padding:4px 6px}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.go{font:inherit;font-size:18px;padding:12px 30px;background:transparent;color:var(--sheet-ink);border:2px solid var(--sheet-ink);cursor:pointer}
.go:hover{background:var(--sheet-ink);color:var(--sheet)}
.go.sub{font-size:15px;padding:10px 20px;border-width:1px}
.go:focus-visible,.sheet summary:focus-visible,.row :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mm{height:10px;border:1px solid var(--sheet-dim);overflow:hidden}
.mmf{height:100%;width:0;background:var(--sheet-ink);transition:width .06s}
.micbox{border:1px dashed var(--sheet-dim);padding:10px 12px;margin-top:12px}
.micbox p{font-size:14px;margin:0 0 10px}
.microw{display:flex;align-items:center;gap:12px}
.microw .mm{flex:1}
.note{font-size:13px;color:var(--sheet-dim);text-align:center;margin-top:12px;min-height:1em}

@media (max-width:980px){
  #keyhint{display:none}
  #tl{width:220px} #obj{font-size:13px}
  #bl{width:240px} #br{min-width:160px} #loadVal{font-size:28px}
  #inv{bottom:120px;max-width:90%}
  #tc{width:min(360px,40vw)} #timer{font-size:36px}
}
@media (max-width:560px){.sheet h1{font-size:46px}.sheet{padding:24px 18px}.row{grid-template-columns:1fr 120px 46px}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="grain"></div><div id="vig"></div><div id="danger"></div><div id="cross"></div><div id="area"></div>
  <div id="hud">
    <div id="tl">
      <div class="panel"><div class="lbl">Bawa ke mobil</div><ul id="obj"></ul></div>
      <div class="panel hidden" id="hints"><div class="lbl">Catatan dari mobil</div><ul id="hintList"></ul></div>
    </div>
    <div id="tc"><div id="timer">7:30</div><div id="compass"></div></div>
    <div id="keyhint"><div><kbd>Tab</kbd> kontrol</div><div><kbd>H</kbd> petunjuk</div><div><kbd>Esc</kbd> jeda</div></div>
    <div class="panel" id="bl">
      <div class="bar"><span class="lbl">Suara</span><div class="track"><div class="fill" id="noiseFill"></div></div></div>
      <div class="bar"><span class="lbl">Nafas</span><div class="track"><div class="fill" id="stamFill"></div></div></div>
      <div class="bar hidden" id="micBar"><span class="lbl">Mik</span><div class="track"><div class="fill" id="micFill"></div></div></div>
      <div id="state"></div>
    </div>
    <div class="panel" id="br"><div class="lbl">Beban</div><div id="loadVal">0</div><div id="speedVal">Langkah 100%</div><div id="lootVal">Di mobil: Rp 0rb</div><div id="curseVal" class="hidden" style="color:var(--danger)"></div></div>
    <div id="inv"></div>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div class="panel" id="help"></div>
  </div>
  <div id="overlay"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const isTouch=false;
const noMouse=!matchMedia('(any-pointer: fine)').matches;
const ov=$('overlay');
function fail(msg){ov.innerHTML=`<div class="sheet"><h1>Ups</h1><p>${msg}</p></div>`;ov.classList.remove('hidden');}
if(!window.THREE){fail('Mesin 3D gagal dimuat. Periksa koneksi internet lalu muat ulang halaman ini.');return;}

// ---------- helpers ----------
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const t=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));}
function wrapA(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}
const fmtW=w=>w%1?w.toFixed(1):String(w);

// ---------- settings ----------
const DEF={sens:1,bright:1,vol:.8,fov:75,quality:'tinggi',invert:false,mic:false,micSens:1};
let CFG=Object.assign({},DEF);
try{const s=JSON.parse(localStorage.getItem('the-alas-cfg')||'null');if(s)CFG=Object.assign(CFG,s);}catch(e){}
function saveCfg(){try{localStorage.setItem('the-alas-cfg',JSON.stringify(CFG));}catch(e){}}

// ---------- renderer ----------
const cvs=$('c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:true,powerPreference:'high-performance'});}
catch(e){fail('Browser ini tidak mendukung WebGL. Coba Chrome, Edge, atau Firefox versi terbaru, dan pastikan akselerasi hardware aktif.');return;}
const SHADOWS=true;
renderer.shadowMap.enabled=true;

const FOG=0x050706;
const scene=new THREE.Scene();
scene.background=new THREE.Color(FOG);
scene.fog=new THREE.FogExp2(FOG,.062);
const camera=new THREE.PerspectiveCamera(CFG.fov,1,.05,95);
camera.rotation.order='YXZ';scene.add(camera);
const flash=new THREE.SpotLight(0xffe1b0,2.7,30,.52,.55,1.1);
flash.position.set(.22,-.15,0);
const flashT=new THREE.Object3D();flashT.position.set(.05,-.35,-6);
camera.add(flash);camera.add(flashT);flash.target=flashT;
flash.castShadow=true;flash.shadow.mapSize.set(1024,1024);flash.shadow.camera.near=.3;flash.shadow.camera.far=30;flash.shadow.bias=-.0015;
const fill=new THREE.PointLight(0xffd9a0,.45,6,1.5);camera.add(fill);
const amb=new THREE.AmbientLight(0x2c3a48,.75);scene.add(amb);
const hemi=new THREE.HemisphereLight(0x50608a,0x0b0a06,.45);scene.add(hemi);
const moon=new THREE.DirectionalLight(0x8494c4,.28);moon.position.set(-40,60,20);scene.add(moon);
const holder=new THREE.Group();holder.position.set(.34,-.34,-.68);camera.add(holder);

function resize(){
  const w=cvs.clientWidth,h=cvs.clientHeight;
  renderer.setSize(w,h,false);camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
function applyCfg(){
  const q={tinggi:1,sedang:.75,rendah:.5}[CFG.quality]||1;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5)*q);
  cvs.classList.toggle('px',q<1);
  flash.castShadow=CFG.quality!=='rendah';
  camera.fov=CFG.fov;
  const b=CFG.bright;amb.intensity=.75*b;hemi.intensity=.45*b;moon.intensity=.28*b;fill.intensity=.45*Math.max(1,b);
  if(master&&!muted)master.gain.value=CFG.vol;
  resize();
}

const M=(color,o={})=>new THREE.MeshPhongMaterial(Object.assign({color,flatShading:true,shininess:4,specular:0x0c0c0c},o));
const glintTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();

// ---------- world data (meters) ----------
const WORLD=160,TOTAL=450;
const CAR={x:80,z:12};
const LANDMARKS=[
  {id:'gubuk',name:'Gubuk Reyot',x:34,z:44,kind:'hut',cr:3.6},
  {id:'sumur',name:'Sumur Tua',x:124,z:40,kind:'well',cr:1.5},
  {id:'beringin',name:'Pohon Beringin',x:81,z:78,kind:'banyan',cr:2.4},
  {id:'makam',name:'Makam Keramat',x:127,z:115,kind:'graves',cr:4.2},
  {id:'pos',name:'Pos Ronda',x:32,z:116,kind:'post',cr:2.3},
  {id:'kali',name:'Kali Kering',x:80,z:140,kind:'creek',cr:0},
];
const GRAVES=[[-3.2,-1.7],[-.3,-2.6],[2.8,-1.6],[-2.3,1.8],[.6,1.5],[3.4,2.2]];
const CREEK=[[38,130],[47,133],[60,138],[73,136],[86,141],[100,139],[114,144],[127,141],[140,146]];
const creekD=(x,z)=>{let m=1e9;for(let i=0;i<CREEK.length-1;i++)m=Math.min(m,segDist(x,z,CREEK[i][0],CREEK[i][1],CREEK[i+1][0],CREEK[i+1][1]));return m;};
const REQ=[
  {id:'kunci',name:'Kunci Mobil',w:.5,hint:L=>`“Kuncinya pasti jatuh waktu aku lari lewat ${L}.”`},
  {id:'busi',name:'Busi',w:.5,hint:L=>`“Ada kotak perkakas tertinggal di ${L}.”`},
  {id:'aki',name:'Aki',w:3,hint:L=>`“Seseorang menyimpan aki di ${L}. Berat sekali.”`},
  {id:'bensin',name:'Jeriken Bensin',w:3.5,hint:L=>`“Tadi sore kulihat jeriken di ${L}.”`},
];
const LOOT=[
  {k:'keris',name:'Keris Pusaka',w:2,v:500},{k:'kalung',name:'Kalung Emas',w:1,v:300},{k:'kendi',name:'Kendi Antik',w:2.5,v:250},
  {k:'radio',name:'Radio Tua',w:3,v:200},{k:'petromaks',name:'Petromaks',w:2,v:150},{k:'uang',name:'Uang Kuno',w:.5,v:100},
  {k:'wayang',name:'Wayang Kulit',w:1,v:180},{k:'arloji',name:'Arloji Saku',w:.5,v:220},{k:'gong',name:'Gong Kecil',w:4,v:450},{k:'topeng',name:'Topeng Kayu',w:1.5,v:160},
];

// ---------- mesh builders ----------
function part(geo,mat,x,y,z,rx,ry,rz){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);m.rotation.set(rx||0,ry||0,rz||0);m.castShadow=SHADOWS;m.receiveShadow=SHADOWS;return m;}
function itemMesh(def){
  const g=new THREE.Group(),k=def.id||def.k;
  const gold=M(0xb8862e,{shininess:40,specular:0x553311}),metal=M(0x8a8a86,{shininess:30}),dark=M(0x1d1f1c),wood=M(0x5a3d22);
  switch(k){
    case'kunci':g.add(part(new THREE.TorusGeometry(.06,.018,5,8),gold,0,.02,0,Math.PI/2),part(new THREE.BoxGeometry(.14,.02,.035),gold,.13,.02,0));break;
    case'busi':g.add(part(new THREE.CylinderGeometry(.025,.025,.13,6),M(0xe8e2d0),0,.03,0,0,0,Math.PI/2),part(new THREE.CylinderGeometry(.04,.04,.05,6),metal,.08,.03,0,0,0,Math.PI/2));break;
    case'aki':g.add(part(new THREE.BoxGeometry(.34,.22,.2),M(0x1f2b27),0,.11,0),part(new THREE.CylinderGeometry(.025,.025,.05,6),M(0xa02a20),-.1,.24,0),part(new THREE.CylinderGeometry(.025,.025,.05,6),dark,.1,.24,0));break;
    case'bensin':g.add(part(new THREE.BoxGeometry(.3,.42,.17),M(0x8c2b1e),0,.21,0),part(new THREE.BoxGeometry(.18,.05,.05),M(0x6e2017),-.02,.45,0),part(new THREE.CylinderGeometry(.03,.03,.08,6),dark,.11,.45,0));break;
    case'keris':g.add(part(new THREE.ConeGeometry(.03,.42,4),metal,.2,.03,0,0,0,-Math.PI/2),part(new THREE.BoxGeometry(.12,.04,.05),wood,-.04,.03,0));break;
    case'kalung':g.add(part(new THREE.TorusGeometry(.1,.012,4,12),gold,0,.015,0,Math.PI/2));break;
    case'kendi':g.add(part(new THREE.IcosahedronGeometry(.16,0),M(0x8a4b2c),0,.16,0),part(new THREE.CylinderGeometry(.04,.05,.14,6),M(0x8a4b2c),0,.34,0));break;
    case'radio':g.add(part(new THREE.BoxGeometry(.36,.22,.14),M(0x5b4632),0,.11,0),part(new THREE.CylinderGeometry(.06,.06,.02,8),dark,-.08,.12,.075,Math.PI/2));break;
    case'petromaks':g.add(part(new THREE.CylinderGeometry(.08,.1,.14,8),M(0x6e7a74),0,.07,0),part(new THREE.IcosahedronGeometry(.09,0),M(0xe8e0c8,{transparent:true,opacity:.6}),0,.22,0),part(new THREE.CylinderGeometry(.04,.06,.06,8),M(0x6e7a74),0,.33,0));break;
    case'uang':for(let i=0;i<4;i++)g.add(part(new THREE.CylinderGeometry(.05,.05,.012,8),gold,i*.03,.006+i*.012,0));break;
    case'wayang':g.add(part(new THREE.BoxGeometry(.16,.02,.42),M(0x7a4a1e),0,.012,0),part(new THREE.CylinderGeometry(.008,.008,.3,4),wood,0,.012,.3,Math.PI/2));break;
    case'arloji':g.add(part(new THREE.CylinderGeometry(.05,.05,.02,10),gold,0,.01,0),part(new THREE.TorusGeometry(.02,.006,4,8),gold,0,.01,.065,Math.PI/2));break;
    case'gong':g.add(part(new THREE.CylinderGeometry(.3,.3,.06,12),M(0x9a7a2a,{shininess:40}),0,.03,0),part(new THREE.IcosahedronGeometry(.07,0),M(0x9a7a2a),0,.07,0));break;

// ---------- audio ----------
let AC=null,master=null,muted=false,noiseBuf=null,engine=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:CFG.vol;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=170;const g=AC.createGain();g.gain.value=.05;f.connect(g).connect(master);
    [42,42.6,63.3].forEach(fr=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(f);o.start();});
  }catch(e){AC=null;}
}
function out(pan){if(pan==null||!AC.createStereoPanner)return master;const p=AC.createStereoPanner();p.pan.value=clamp(pan,-1,1);p.connect(master);return p;}
function tone(freq,dur,type='sine',vol=.2,slide,pan){
  if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(out(pan));o.start(t);o.stop(t+dur+.05);
}
function burst(dur,vol,freq,pan){
  if(!AC||muted||!noiseBuf)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(out(pan));s.start(t,Math.random()*.5);s.stop(t+dur+.05);
}
const sfx={
  step:n=>burst(.06,.03+n/100*.16,420+n*7),
  pick:()=>{tone(520,.08,'triangle',.12);burst(.12,.18,1400);},
  drop:()=>{tone(90,.35,'sine',.5,40);burst(.3,.5,300);},
  thud:()=>{tone(80,.2,'sine',.4,45);burst(.15,.3,350);},
  clunk:()=>{tone(140,.25,'square',.08,70);burst(.2,.3,600);},
  growl:p=>{tone(95,1.1,'sawtooth',.22,38,p);burst(.9,.25,180,p);},
  mstep:(v,p)=>{tone(55,.18,'sine',v,35,p);burst(.1,v*.5,220,p);},
  beat:()=>{tone(62,.16,'sine',.55);setTimeout(()=>tone(50,.2,'sine',.4),190);},
  win:()=>{tone(220,.6,'triangle',.18,440);setTimeout(()=>tone(330,.8,'triangle',.15,660),250);},
  caught:()=>{burst(1.2,.9,900);tone(300,1.2,'sawtooth',.35,40);},
};
function startEngineSound(){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(30,AC.currentTime);o.frequency.linearRampToValueAtTime(72,AC.currentTime+3);g.gain.value=.16;o.connect(g).connect(master);o.start();engine=o;}
function stopEngineSound(){if(engine){try{engine.stop();}catch(e){}engine=null;}}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:CFG.vol;toast(muted?'Bunyi dimatikan.':'Bunyi dinyalakan.',1.2);}

// ---------- microphone ----------
const MIC={on:false,stream:null,src:null,an:null,buf:null,bbuf:null,db:-100,floor:-60,level:0,status:''};
async function micEnable(){
  if(MIC.on)return true;
  initAudio();if(!AC){MIC.status='Browser ini tidak mendukung audio';return false;}
  if(AC.state==='suspended'){try{await AC.resume();}catch(e){}}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){MIC.status='Browser ini tidak mendukung mikrofon (halaman harus dibuka lewat https)';return false;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});
    const src=AC.createMediaStreamSource(st),an=AC.createAnalyser();an.fftSize=1024;src.connect(an);
    Object.assign(MIC,{stream:st,src,an,buf:new Float32Array(an.fftSize),bbuf:new Uint8Array(an.fftSize),on:true,status:'',floor:-60,level:0});
    return true;
  }catch(e){
    MIC.status=e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'Izin mikrofon ditolak atau diblokir halaman ini':'Mikrofon tidak ditemukan';
    return false;
  }
}
function micDisable(){
  if(MIC.stream)MIC.stream.getTracks().forEach(t=>t.stop());
  if(MIC.src){try{MIC.src.disconnect();}catch(e){}}
  Object.assign(MIC,{on:false,stream:null,src:null,an:null,level:0,status:''});
}
function micSample(dt){
  if(!MIC.on||!MIC.an){MIC.level=0;return 0;}
  let sum=0;const n=MIC.buf.length;
  if(MIC.an.getFloatTimeDomainData){MIC.an.getFloatTimeDomainData(MIC.buf);for(let i=0;i<n;i++)sum+=MIC.buf[i]*MIC.buf[i];}
  else{MIC.an.getByteTimeDomainData(MIC.bbuf);for(let i=0;i<n;i++){const v=(MIC.bbuf[i]-128)/128;sum+=v*v;}}
  const db=20*Math.log10(Math.sqrt(sum/n)+1e-8);MIC.db=db;
  if(db<MIC.floor)MIC.floor=lerp(MIC.floor,db,Math.min(1,dt*4));else if(db<MIC.floor+10)MIC.floor+=dt*1.5;
  MIC.floor=clamp(MIC.floor,-90,-35);
  const gate=Math.max(-45-8*Math.log2(CFG.micSens),MIC.floor+8);
  const lvl=clamp((db-gate)/35*100,0,100);
  MIC.level=lvl>MIC.level?lvl:Math.max(lvl,MIC.level-45*dt);
  return MIC.level;
}
function updateMicUI(){
  document.querySelectorAll('.micBtn').forEach(b=>{b.textContent=MIC.on?'Matikan mikrofon':'Nyalakan mikrofon';});
  document.querySelectorAll('.micStat').forEach(e=>{e.textContent=MIC.on?'Mikrofon menyala. Coba bicara, bar di atas akan bergerak.':MIC.status;});
}
async function toggleMic(){
  if(MIC.on){micDisable();CFG.mic=false;toast('Mikrofon dimatikan.',1.4);}
  else{const ok=await micEnable();CFG.mic=ok;toast(ok?'Mikrofon menyala. Hati-hati bicara.':MIC.status+'.',2.6);}
  saveCfg();updateMicUI();
}

const keys={};const joy={active:false,dx:0,dy:0};let touchSprint=false;
let locked=false,lockOK=false,wantLock=false,dragLook=false,mouseDown=false,resumePending=false;
function look(dx,dy,s){if(!S||!running||paused||S.mode==='over')return;const p=S.player;p.yaw-=dx*s;p.pitch=clamp(p.pitch-(CFG.invert?-dy:dy)*s,-1.35,1.35);}
function tryLock(){

// ---------- actions ----------
const carryLoad=()=>S.player.carried.reduce((s,it)=>s+it.def.w,0);
const allDep=()=>S.deposited.size===REQ.length;
const missing=()=>REQ.filter(r=>!S.deposited.has(r.id)).map(r=>r.name);
const fwd=p=>({x:-Math.sin(p.yaw),z:-Math.cos(p.yaw)});
const carDist=()=>Math.hypot(S.player.x-CAR.x,S.player.z-CAR.z);
function nearestItem(){
  const p=S.player,f=fwd(p);let best=null,bs=-1;
  for(const it of S.items){if(it.state!=='ground')continue;const dx=it.x-p.x,dz=it.z-p.z,d=Math.hypot(dx,dz);if(d>2.5)continue;
    const dot=d<.9?1:(dx*f.x+dz*f.z)/d;if(dot<.45)continue;const sc=dot*2-d;if(sc>bs){bs=sc;best=it;}}
  return best;
}
function addNoise(v){S.noise=Math.min(100,S.noise+v);}
let toastT=0,areaT=0;
function toast(t,d=2.2){const el=$('toast');el.textContent=t;el.style.opacity=1;toastT=d;}
function areaCaption(t){const el=$('area');el.textContent=t;el.style.opacity=1;areaT=2.6;}
function toggleCrouch(){if(!S||S.mode!=='play')return;S.player.crouch=!S.player.crouch;}
function toggleHints(){if(!S)return;S.hintsOpen=!S.hintsOpen;$('hints').classList.toggle('hidden',!S.hintsOpen);}
function selectSlot(i){if(i<S.player.carried.length){S.sel=i;refreshHeld();renderInv();}}
function cycleSel(d){const n=S.player.carried.length;if(!n)return;S.sel=(S.sel+d+n)%n;refreshHeld();renderInv();}
function refreshHeld(){
  while(holder.children.length)holder.remove(holder.children[0]);
  const it=S.player.carried[S.sel];if(!it)return;
  const m=it.mesh.clone();m.visible=true;m.position.set(0,0,0);m.rotation.set(.5,.6,0);
  const sz=it.def.w>2?1:1.6;m.scale.set(sz,sz,sz);m.traverse(o=>{o.castShadow=false;});holder.add(m);
}
function renderInv(){
  const p=S.player,el=$('inv');
  if(!p.carried.length){el.innerHTML='<div class="slot empty"><span class="n">Tangan kosong</span></div>';return;}
  el.innerHTML=p.carried.map((it,i)=>`<div class="slot${i===S.sel?' sel':''}${it.req?' req':''}"><span class="n">${i+1}</span> <span class="nm">${it.def.name}</span><br><span class="n">beban ${fmtW(it.def.w)}</span></div>`).join('');
}
function doJump(){
  const p=S.player;if(S.mode!=='play'||p.air)return;
  const load=carryLoad(),cost=10+load*2;
  if(p.stamina<cost){toast('Terlalu lelah untuk melompat.',1.4);return;}
  p.stamina-=cost;const lm=Math.max(.35,1-load*.07);
  p.vy=4.3*lm;p.air=true;p.crouch=false;addNoise(6);
}
function doUse(){
  if(S.mode!=='play')return;const p=S.player,dc=carDist();
  if(dc<3.8&&p.carried.length){
    const n=p.carried.length;
    for(const it of p.carried){it.state='deposited';if(it.req)S.deposited.add(it.def.id);else{S.lootValue+=it.def.v;S.lootCount++;}}
    p.carried=[];S.sel=0;refreshHeld();renderInv();addNoise(8+n*4);sfx.clunk();
    toast(allDep()?'Semua lengkap. Nyalakan mesinnya!':`Disimpan di mobil. Kurang ${REQ.length-S.deposited.size} lagi.`,2.6);
    renderObj();renderHints();return;
  }
  if(dc<3.8&&allDep()){
    S.mode='starting';S.startT=3;startEngineSound();
    S.headMat.color.setHex(0xfff2c8);S.head.intensity=2.2;toast('Mesin meraung. Bertahan tiga detik!',3);return;
  }
  const it=nearestItem();
  if(it){
    if(!it.req&&!it.cursed){it.cursed=true;S.curse++;burst(1.4,.25,160);setTimeout(()=>{if(S&&S.mode==='play')toast('Alas tidak suka barangnya diambil. Ia makin peka.',2.4);},1900);}
    it.state='carried';it.mesh.visible=false;it.glint.visible=false;p.carried.push(it);S.sel=p.carried.length-1;refreshHeld();renderInv();
    addNoise(16+it.def.w*3);sfx.pick();toast(`${it.def.name} diambil. Beban +${fmtW(it.def.w)}`,1.8);renderObj();renderHints();return;
  }
  if(dc<3.8)toast(`Mobil masih butuh: ${missing().join(', ')}`,2.4);
}
function doDrop(){
  const p=S.player;if(S.mode!=='play'||!p.carried.length)return;
  const it=p.carried.splice(S.sel,1)[0],f=fwd(p);it.state='ground';
  S.sel=Math.max(0,Math.min(S.sel,p.carried.length-1));
  it.x=p.x+f.x*.9;it.z=p.z+f.z*.9;it.mesh.position.set(it.x,0,it.z);it.mesh.visible=true;it.glint.position.set(it.x,.35,it.z);it.glint.visible=true;
  refreshHeld();renderInv();
  if(p.crouch){addNoise(8+it.def.w);sfx.step(20);toast(`${it.def.name} diletakkan pelan.`,1.4);}
  else{addNoise(26+it.def.w*4);sfx.drop();toast(`${it.def.name} dibuang. BRAK!`,1.6);}
  renderObj();renderHints();
}
function doThrow(){
  const p=S.player;if(S.mode!=='play'||!p.carried.length)return;
  const it=p.carried.splice(S.sel,1)[0],f=fwd(p);
  S.sel=Math.max(0,Math.min(S.sel,p.carried.length-1));
  const maxD=Math.max(4,9-it.def.w*.8);let ex=p.x+f.x,ez=p.z+f.z;
  for(let d=1.5;d<=maxD;d+=.5){const x=p.x+f.x*d,z=p.z+f.z*d;if(x<1||z<1||x>WORLD-1||z>WORLD-1||S.obs.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+.25))break;ex=x;ez=z;}
  it.state='flying';it.fly={sx:p.x+f.x*.5,sz:p.z+f.z*.5,ex,ez,t:0,dur:.6};it.mesh.visible=true;
  refreshHeld();renderInv();addNoise(6);tone(300,.15,'triangle',.06,180);renderObj();renderHints();
  if(!S.tips.lure){S.tips.lure=true;toast('Bunyi barang yang jatuh akan memancing makhluk itu ke sana.',2.6);}
}

// ---------- simulation ----------
function pushOut(e,list){
  for(const o of list){const dx=e.x-o.x,dz=e.z-o.z,rr=o.r+e.r;if(dx>rr||dx<-rr||dz>rr||dz<-rr)continue;const d=Math.hypot(dx,dz);if(d<rr&&d>1e-4){const k=(rr-d)/d;e.x+=dx*k;e.z+=dz*k;}}
}
function pushLogs(e){
  let hit=false;
  for(const l of S.logs){const dx=l.bx-l.ax,dz=l.bz-l.az;const t=clamp(((e.x-l.ax)*dx+(e.z-l.az)*dz)/(dx*dx+dz*dz),0,1);
    const cx=l.ax+dx*t,cz=l.az+dz*t,ex=e.x-cx,ez=e.z-cz,d=Math.hypot(ex,ez),rr=e.r+.4;
    if(d<rr&&d>1e-4){e.x+=ex/d*(rr-d);e.z+=ez/d*(rr-d);hit=true;}}
  return hit;
}
function panTo(x,z){const p=S.player,dx=x-p.x,dz=z-p.z,d=Math.hypot(dx,dz)||1;return(dx*Math.cos(p.yaw)-dz*Math.sin(p.yaw))/d;}

function update(dt){
  const p=S.player;
  S.timeLeft-=dt;
  if(S.timeLeft<=0){S.timeLeft=0;endGame('time');return;}
  if(!S.lateWarned&&S.timeLeft<60){S.lateWarned=true;toast('Satu menit lagi. Ia makin lapar.',3);}

  const load=carryLoad(),loadMul=Math.max(.3,1-load*.06);
  let fw=0,rt=0;
  if(S.mode==='play'){
    if(keys.w||keys.arrowup)fw+=1;if(keys.s||keys.arrowdown)fw-=1;if(keys.d)rt+=1;if(keys.a)rt-=1;
    if(keys.arrowleft)p.yaw+=dt*2.2;if(keys.arrowright)p.yaw-=dt*2.2;
    
  }
  let mag=Math.hypot(fw,rt);const moving=mag>.2;
  if(moving){fw/=mag;rt/=mag;}mag=Math.min(1,mag);
  const crouch=p.crouch;
  const wantSprint=keys.shift&&!crouch&&moving&&fw>-.3&&!p.exhausted&&!p.air;
  if(wantSprint){p.stamina-=(22+load*5)*dt;if(p.stamina<=0){p.stamina=0;p.exhausted=true;toast('Kehabisan nafas…',1.6);}}
  else{p.stamina=Math.min(100,p.stamina+Math.max(6,18-load*1.2)*dt*(moving?.7:1));if(p.exhausted&&p.stamina>35)p.exhausted=false;}
  const sprinting=wantSprint&&p.stamina>0;
  let base=crouch?1.45:sprinting?5.3:2.9;if(p.exhausted)base=Math.min(base,2.1);
  const sp=base*loadMul*(moving?Math.min(1,.45+mag*.7):0);
  const f=fwd(p),rx=Math.cos(p.yaw),rz=-Math.sin(p.yaw);
  const tvx=(f.x*fw+rx*rt)*sp,tvz=(f.z*fw+rz*rt)*sp;

  if(p.air){p.y+=p.vy*dt;p.vy-=12*dt;if(p.y<=0){p.y=0;p.air=false;p.vy=0;addNoise(20+load*5);sfx.thud();S.shake=.06;}}
  const acc=p.air?1.5:11;
  p.vx=lerp(p.vx,tvx,Math.min(1,dt*acc));p.vz=lerp(p.vz,tvz,Math.min(1,dt*acc));
  p.x+=p.vx*dt;p.z+=p.vz*dt;
  pushOut(p,S.obs);
  if(p.y<.45&&pushLogs(p)&&!S.tips.log){S.tips.log=true;toast(load>3?'Batang tumbang. Terlalu berat untuk melompatinya.':'Batang tumbang. Lompati dengan Spasi.',2.6);}
  p.x=clamp(p.x,1,WORLD-1);p.z=clamp(p.z,1,WORLD-1);

  let inBush=false;for(const b of S.bushes){const dx=p.x-b.x,dz=p.z-b.z;if(dx*dx+dz*dz<b.r*b.r){inBush=true;break;}}
  const onGravel=creekD(p.x,p.z)<2.6;
  if(inBush&&moving&&!S.tips.bush){S.tips.bush=true;toast('Semak ini berisik.',1.6);}
  let nt=0;if(moving&&!p.air)nt=(crouch?5:sprinting?55:20)+load*(crouch?2:3)+(inBush?14:0)+(onGravel?10:0);
  if(S.mode==='starting')nt=100;
  if(S.noise<nt)S.noise=Math.min(100,S.noise+(nt-S.noise)*Math.min(1,dt*3));else S.noise=Math.max(nt,S.noise-28*dt);
  S.micN=MIC.level;S.total=Math.min(100,Math.max(S.noise,S.micN)+.3*Math.min(S.noise,S.micN));

  const spd=Math.hypot(p.vx,p.vz);
  if(spd>.3){S.loadInt+=load*dt;S.moveT+=dt;}
  if(spd>.3&&!p.air){p.bob+=dt*spd*2.3;S.stepT-=dt*spd/2.9;if(S.stepT<=0){S.stepT=.5;sfx.step(S.noise);}}
  p.eye=lerp(p.eye,(crouch?1.0:1.62)-Math.min(.25,load*.035),Math.min(1,dt*8));

  if(S.mode==='starting'){
    S.startT-=dt;S.car.position.x=CAR.x+rand(-.02,.02);
    if(S.startT<=0){endGame('win');return;}
  }

  // area captions
  let inArea=null;for(const L of LANDMARKS)if(Math.hypot(p.x-L.x,p.z-L.z)<13){inArea=L;break;}
  if(inArea&&S.area!==inArea.id){S.area=inArea.id;areaCaption(inArea.name);}
  if(!inArea&&Math.hypot(p.x-CAR.x,p.z-CAR.z)>16)S.area=null;

  for(const it of S.items){
    if(it.state!=='flying')continue;const F=it.fly;F.t+=dt/F.dur;const k=Math.min(1,F.t);
    it.mesh.position.set(lerp(F.sx,F.ex,k),(1-k)*1.3+3.2*k*(1-k),lerp(F.sz,F.ez,k));it.mesh.rotation.x+=dt*9;
    if(k>=1){it.state='ground';it.x=F.ex;it.z=F.ez;delete it.fly;it.mesh.position.set(it.x,0,it.z);it.mesh.rotation.x=0;
      it.glint.position.set(it.x,.35,it.z);it.glint.visible=true;S.events.push({x:it.x,z:it.z,n:Math.min(100,45+it.def.w*6)});
      const pn=panTo(it.x,it.z);tone(90,.35,'sine',.4,40,pn);burst(.3,.45,300,pn);renderHints();}
  }
  updateMonster(dt);
  if(S.mode==='over')return;

  const m=S.monster,d=Math.hypot(m.x-p.x,m.z-p.z);
  S.danger=lerp(S.danger,clamp(1-d/24,0,1)*(m.state==='chase'?1:.55),Math.min(1,dt*4));
  $('danger').style.opacity=(S.danger*.85).toFixed(3);
  S.shake=Math.max(S.shake-dt,m.state==='chase'&&d<9?(1-d/9)*.05:0);
  S.flicker=lerp(S.flicker,d<13&&Math.random()<.2?rand(.3,.75):1,.35);
  if(d<26){S.hbT-=dt;if(S.hbT<=0){sfx.beat();S.hbT=.38+(d/26)*.9;}}
}

function updateMonster(dt){
  const m=S.monster,p=S.player,d=Math.hypot(p.x-m.x,p.z-m.z);
  const hm=1+.1*S.curse,hears=d<(S.total*.32+.8)*hm;
  for(const ev of S.events){const de=Math.hypot(ev.x-m.x,ev.z-m.z);if(de<(ev.n*.32+.8)*hm&&(m.state!=='chase'||m.lost>0)){m.state='hunt';m.target={x:ev.x,z:ev.z};m.search=0;m.lost=0;m.last=null;}}
  S.events.length=0;
  if(hears){
    const err=Math.min(7,d*.12);m.last={x:p.x+rand(-err,err),z:p.z+rand(-err,err)};m.lost=0;
    if(m.state!=='chase'&&(d<7||(S.total>38&&d<16)||S.mode==='starting')){m.state='chase';sfx.growl(panTo(m.x,m.z));toast(S.micN>S.noise?'Ia mendengar suaramu.':'Ia mendengarmu.',1.6);}
    else if(m.state!=='chase'){m.state='hunt';m.target=m.last;m.search=0;}
  }
  if(m.state==='chase'){
    if(hears)m.target={x:p.x,z:p.z};
    else{m.lost+=dt;if(m.last)m.target=m.last;if(m.lost>2.2){m.state='hunt';m.search=0;}}
  }else if(m.state==='hunt'){
    if(!m.target||Math.hypot(m.target.x-m.x,m.target.z-m.z)<1.2){m.search+=dt;if(m.search>2.8){m.state='wander';m.target=null;}}
  }
  if(m.state==='wander'){
    m.wT-=dt;
    if(!m.target||m.wT<=0||Math.hypot(m.target.x-m.x,m.target.z-m.z)<1.5){
      const frac=1-S.timeLeft/TOTAL,bias=S.timeLeft<60?.9:.2+frac*.55;
      if(Math.random()<bias)m.target={x:clamp(p.x+rand(-24,24),3,WORLD-3),z:clamp(p.z+rand(-24,24),3,WORLD-3)};
      else m.target={x:clamp(m.x+rand(-40,40),3,WORLD-3),z:clamp(m.z+rand(-40,40),3,WORLD-3)};
      m.wT=rand(5,9);
    }
  }
  const sp={wander:1.45,hunt:2.8,chase:4.3}[m.state]*(S.timeLeft<60?1.15:1)*(1+.06*S.curse);
  let moved=0;
  if(m.target){
    const dx=m.target.x-m.x,dz=m.target.z-m.z,td=Math.hypot(dx,dz);
    if(td>.15){
      let a=Math.atan2(dx,dz);if(m.detT>0){m.detT-=dt;a+=m.detSign*1.2;}
      const ox=m.x,oz=m.z;m.x+=Math.sin(a)*sp*dt;m.z+=Math.cos(a)*sp*dt;
      pushOut(m,S.obs);m.x=clamp(m.x,1,WORLD-1);m.z=clamp(m.z,1,WORLD-1);
      moved=Math.hypot(m.x-ox,m.z-oz)/dt;
      m.face+=wrapA(Math.atan2(m.x-ox,m.z-oz)-m.face)*Math.min(1,dt*6);
    }
    m.progT+=dt;
    if(m.progT>.7){if(Math.hypot(m.x-m.px,m.z-m.pz)<sp*.25&&td>1.5){m.detT=.9;m.detSign=Math.random()<.5?-1:1;}m.px=m.x;m.pz=m.z;m.progT=0;}
  }
  m.speed=lerp(m.speed,moved,.2);
  if(m.speed>.3&&d<28){m.stepT-=dt*m.speed/1.6;if(m.stepT<=0){m.stepT=1;sfx.mstep(.35*(1-d/28),panTo(m.x,m.z));}}
  if(d<p.r+m.r+.05)endGame('caught');
}

function poseMonster(dt){
  const m=S.monster,mo=S.mon;
  m.phase+=dt*(1.2+m.speed*1.6);
  const sw=Math.sin(m.phase),k=clamp(m.speed/3,0,1);
  mo.g.position.set(m.x,Math.abs(Math.cos(m.phase))*.06*k,m.z);mo.g.rotation.y=m.face;
  mo.legL.rotation.x=sw*.65*k;mo.legR.rotation.x=-sw*.65*k;
  const reach=m.state==='chase'||S.scareT>0;
  mo.armL.rotation.x=lerp(mo.armL.rotation.x,reach?-1.2+sw*.25:-sw*.4*k,Math.min(1,dt*6));
  mo.armR.rotation.x=lerp(mo.armR.rotation.x,reach?-1.2-sw*.25:sw*.4*k,Math.min(1,dt*6));
  mo.armL.rotation.z=-.08;mo.armR.rotation.z=.08;
  mo.head.rotation.z=m.state==='chase'?Math.sin(m.phase*3.1)*.25:Math.sin(m.phase*.3)*.15;
  const d=Math.hypot(m.x-S.player.x,m.z-S.player.z);
  const far=m.state!=='wander'||S.scareT>0;
  const mat=far?mo.eyeFar:mo.eyeFog;
  mo.eyes.forEach(e=>{e.material=mat;});
  const c=m.state==='chase'||S.scareT>0?0xff3a24:m.state==='hunt'?0xe0c890:0xd8cfb0;
  mo.eyeFar.color.setHex(c);mo.eyeFog.color.setHex(d<18?c:0x6a6656);
}

function render(dt){
  const p=S.player,T=performance.now()/1000;
  const load=S.player.carried?carryLoad():0;
  const bobA=.035*(1+load*.15),moving=Math.hypot(p.vx,p.vz)>.3;
  const by=moving&&!p.air?Math.sin(p.bob*2)*bobA:0,bx=moving&&!p.air?Math.cos(p.bob)*bobA*.6:0;
  const sh=S.shake>0?S.shake:0;
  camera.position.set(p.x+bx*Math.cos(p.yaw)+rand(-sh,sh),p.eye+p.y+by+rand(-sh,sh),p.z-bx*Math.sin(p.yaw));
  camera.rotation.set(p.pitch,p.yaw,moving?Math.cos(p.bob)*.012*(1+load*.25):0);
  flash.intensity=2.7*S.flicker;
  holder.position.set(.34+bx*.5,-.36+by*.7-Math.min(.12,load*.015),-.68);
  for(const it of S.items){if(it.state!=='ground')continue;it.glint.material.opacity=.35+.3*Math.sin(T*3+it.bob);}
  poseMonster(dt);
  renderer.render(scene,camera);
}

}
function compass(){
  const p=S.player,f=fwd(p),rx=Math.cos(p.yaw),rz=-Math.sin(p.yaw);
  const marks=[{x:CAR.x,z:CAR.z,t:'Mobil',c:p.carried.length||allDep()?'var(--accent)':'var(--ink-dim)'}];
  if(S.hintsOpen)for(const r of S.reqInfo)if(r.item.state==='ground')marks.push({x:r.L.x,z:r.L.z,t:r.L.name,c:'var(--accent)'});
  cmk.forEach((el,i)=>{
    const mk=marks[i];if(!mk||S.mode==='idle'){el.style.display='none';return;}
    const dx=mk.x-p.x,dz=mk.z-p.z,a=Math.atan2(dx*rx+dz*rz,dx*f.x+dz*f.z);
    const pos=clamp(a/(Math.PI/2),-1,1);el.style.display='block';el.style.left=(50+pos*46)+'%';el.style.color=mk.c;
    el.textContent=(a<-Math.PI/2?'‹ ':'')+mk.t+(a>Math.PI/2?' ›':'')+` ${Math.round(Math.hypot(dx,dz))} m`;
  });
}
function hud(){
  const p=S.player,t=Math.ceil(S.timeLeft);
  $('timer').textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
  $('timer').classList.toggle('late',S.timeLeft<60&&S.mode!=='idle');
  const nf=$('noiseFill');nf.style.width=S.total.toFixed(1)+'%';nf.style.background=S.total<30?'#cfc4a8':S.total<60?'#e0a63c':'#b8352b';
  $('micBar').classList.toggle('hidden',!MIC.on);$('micFill').style.width=MIC.level.toFixed(0)+'%';$('micFill').style.background=MIC.level>25?'#e0a63c':'#cfc4a8';
  document.querySelectorAll('.micMeter').forEach(e=>{e.style.width=MIC.level.toFixed(0)+'%';});
  const sf=$('stamFill');sf.style.width=p.stamina.toFixed(1)+'%';sf.style.background=p.exhausted?'#6e6553':'#8aa894';
  const load=carryLoad();

  const cv=$('curseVal');cv.classList.toggle('hidden',!S.curse);if(S.curse)cv.textContent=`Kutukan ×${S.curse}`;
  const st=MIC.on&&MIC.level>25?'Suaramu terdengar':p.exhausted?'Kehabisan nafas':p.crouch?'Jongkok':'';
  if(st!==lastState){lastState=st;$('state').textContent=st;}
  compass();
  let pt='';
  if(S.mode==='starting')pt=`Mesin menyala… ${Math.max(0,S.startT).toFixed(1)} dtk`;
  else if(S.mode==='play'){
    const dc=carDist();
    if(!locked&&!dragLook&&running&&!paused)pt='Klik layar untuk mengunci mouse';
    else if(dc<3.8&&p.carried.length)pt=`<kbd>E</kbd> Taruh ${p.carried.length} barang di mobil`;
    else if(dc<3.8&&allDep())pt='<kbd>E</kbd> Nyalakan mesin dan kabur';
    else{const it=nearestItem();
      if(it)pt=`<kbd>E</kbd> Ambil ${it.def.name}, beban ${fmtW(it.def.w)}${it.req?'':`, Rp ${it.def.v}rb`}`;
      else if(dc<3.8)pt=`Mobil butuh: ${missing().join(', ')}`;}
  }
  if(pt!==lastPrompt){lastPrompt=pt;$('prompt').innerHTML=pt;$('prompt').classList.toggle('show',!!pt);}
}

function endGame(kind){
  if(S.mode==='over')return;
  const p=S.player;S.mode='over';stopEngineSound();
  if(document.pointerLockElement){wantLock=false;document.exitPointerLock();}
  const t=Math.ceil(S.timeLeft),tl=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
  let title,sub;
  if(kind==='win'){sfx.win();title='Kamu lolos';
    sub=S.lootCount===0?'Hemat beban, selamat nyawa. Di kaca spion, sesuatu berdiri diam.':S.lootValue>=900?'Rakus, tapi selamat. Kali ini.':'Lampu mobil menembus kabut. Di kaca spion, sesuatu berdiri diam.';}
  else if(kind==='caught'){sfx.caught();title='Tertangkap';S.scareT=.95;
    sub=p.carried.length?`Kamu memikul beban ${fmtW(carryLoad())} saat tertangkap. Langkahmu terlalu berat.`:'Ia tidak perlu melihat. Ia cukup mendengar.';}
  else{sfx.caught();title='Waktu habis';S.scareT=.95;
    const m=S.monster;m.x=p.x+Math.sin(p.yaw)*1.4;m.z=p.z+Math.cos(p.yaw)*1.4;sub='Alas tidak pernah melepaskan tamunya.';}
  $('danger').style.opacity=kind==='win'?0:.95;
  const avg=S.moveT>0?S.loadInt/S.moveT:0;let scoreHTML='';
  if(kind==='win'){
    const sc=Math.round(1000+3*S.timeLeft+150*Math.max(0,4-avg)+S.lootValue/3);let best=0;
    try{best=+(localStorage.getItem('the-alas-best')||0);if(sc>best)localStorage.setItem('the-alas-best',String(sc));}catch(e){}
    const gelar=S.lootCount===0?'Si Pejalan Ringan':S.lootCount<=2?'Pengelana':'Si Serakah yang Beruntung';
    scoreHTML=`<li><b>Skor ${sc}</b>${sc>best?(best?' (rekor baru)':''):`, rekor ${best}`}</li><li>Gelar: ${gelar}</li>`;
  }
  ov.innerHTML=`<div class="sheet"><h1>${title}</h1><div class="tag">${sub}</div>
    <ul class="stats">
      ${scoreHTML}<li>Sisa waktu: ${tl}</li>
      <li>Beban rata-rata saat bergerak: ${avg.toFixed(1)}</li>${S.curse?`<li>Kutukan keserakahan: ×${S.curse}</li>`:''}
      <li>Suku cadang di mobil: ${S.deposited.size} dari ${REQ.length}</li>
      <li>Barang antik ${kind==='win'?'dibawa pulang':'di mobil'}: ${S.lootCount}, senilai Rp ${S.lootValue}rb</li>
    </ul>
    <div class="btns"><button class="go" data-act="start" type="button">Coba lagi</button></div></div>`;
  setTimeout(()=>{running=false;ov.classList.remove('hidden');},kind==='win'?400:1000);
}
function scare(dt){
  const p=S.player,m=S.monster;S.scareT-=dt;
  const dx=m.x-p.x,dz=m.z-p.z,d=Math.hypot(dx,dz)||1;
  m.x=p.x+dx/d*1.05;m.z=p.z+dz/d*1.05;m.face=Math.atan2(-dx,-dz);m.speed=0;
  const ty=Math.atan2(-dx/d,-dz/d),tp=Math.atan2(3.15-p.eye,1.05);
  p.yaw+=wrapA(ty-p.yaw)*Math.min(1,dt*14);p.pitch=lerp(p.pitch,tp,Math.min(1,dt*10));S.shake=.05;
}

}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  micSample(dt);
  if(running&&!paused){
    if(S.mode==='play'||S.mode==='starting')update(dt);
    else if(S.mode==='over'&&S.scareT>0)scare(dt);
  }else if(S.mode==='idle'){S.player.yaw+=dt*.05;}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0;}
  if(areaT>0){areaT-=dt;if(areaT<=0)$('area').style.opacity=0;}
  render(dt);hud();
